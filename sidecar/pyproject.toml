[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hadith-sidecar"
version = "0.2.0"
description = "Local AI backend for Hadith Finder: PDF ingestion, hybrid retrieval, grounded Q&A"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
inference = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "llama-cpp-python>=0.2.90",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hadith_sidecar*"]

[tool.setuptools.package-data]
hadith_sidecar = ["data/*.gz"]
